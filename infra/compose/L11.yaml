services:
  service-operations:
    image: beirut-time/service-operations:local
    build:
      context: .
      dockerfile: services/service-operations/runtime/Dockerfile
      args:
        SERVICE_PATH: services/service-operations
    environment:
      IDENTITY_API_URL: http://identity:8000
      COMMUNICATIONS_API_URL: http://communications:8000
      BT_SERVICE_AUTH_PRIVATE_KEY: ${BT_SERVICE_AUTH_PRIVATE_KEY:-}
  service-operations-migrate:
    image: beirut-time/service-operations:local
    build:
      context: .
      dockerfile: services/service-operations/runtime/Dockerfile
      args:
        SERVICE_PATH: services/service-operations
