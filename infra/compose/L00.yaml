services:
  identity-migrate:
    image: beirut-time/foundation-service:local
    command: [python, -m, service_app.migrate]
    environment:
      BT_SERVICE_NAME: identity
      BT_DATABASE_URL: postgresql://bt_identity_owner:${IDENTITY_OWNER_PASSWORD:-local-identity-owner}@postgres:5432/bt_identity
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  identity:
    image: beirut-time/foundation-service:local
    build:
      context: .
      dockerfile: services/_template/runtime/Dockerfile
    environment:
      BT_SERVICE_NAME: identity
      BT_DATABASE_URL: postgresql://bt_identity:${IDENTITY_DB_PASSWORD:-local-identity}@postgres:5432/bt_identity
      BT_AUTH_ISSUER: beirut-time-identity
      BT_AUTH_AUDIENCE: beirut-time
    ports: ["127.0.0.1:8101:8000"]
    depends_on:
      identity-migrate: {condition: service_completed_successfully}
    init: true
    cpus: 0.5
    mem_limit: 192m
    pids_limit: 100
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
