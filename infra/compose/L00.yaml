    cap_drop: [ALL]
    restart: unless-stopped
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-bootstrap-only}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-local-identity}
      IDENTITY_OWNER_PASSWORD: ${IDENTITY_OWNER_PASSWORD:-local-identity-owner}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-local-catalog}
      CATALOG_OWNER_PASSWORD: ${CATALOG_OWNER_PASSWORD:-local-catalog-owner}
      AUCTION_DB_PASSWORD: ${AUCTION_DB_PASSWORD:-local-auction}
      AUCTION_OWNER_PASSWORD: ${AUCTION_OWNER_PASSWORD:-local-auction-owner}
      PRICING_DB_PASSWORD: ${PRICING_DB_PASSWORD:-local-pricing}
      PRICING_OWNER_PASSWORD: ${PRICING_OWNER_PASSWORD:-local-pricing-owner}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:-local-orders}
      ORDERS_OWNER_PASSWORD: ${ORDERS_OWNER_PASSWORD:-local-orders-owner}
      ELIGIBILITY_DB_PASSWORD: ${ELIGIBILITY_DB_PASSWORD:-local-eligibility}
      ELIGIBILITY_OWNER_PASSWORD: ${ELIGIBILITY_OWNER_PASSWORD:-local-eligibility-owner}
      TRUST_DB_PASSWORD: ${TRUST_DB_PASSWORD:-local-trust}
      TRUST_OWNER_PASSWORD: ${TRUST_OWNER_PASSWORD:-local-trust-owner}
      COMMUNICATIONS_DB_PASSWORD: ${COMMUNICATIONS_DB_PASSWORD:-local-communications}
      COMMUNICATIONS_OWNER_PASSWORD: ${COMMUNICATIONS_OWNER_PASSWORD:-local-communications-owner}
      SERVICE_OPS_DB_PASSWORD: ${SERVICE_OPS_DB_PASSWORD:-local-service-ops}
      SERVICE_OPS_OWNER_PASSWORD: ${SERVICE_OPS_OWNER_PASSWORD:-local-service-ops-owner}
    ports: ["127.0.0.1:54329:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/foundation/postgres-init.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m
  web:
    build: {context: ., dockerfile: web/Dockerfile}
    environment:
      HOSTNAME: 0.0.0.0
      BT_PUBLIC_WEB_ORIGINS: ${BT_PUBLIC_WEB_ORIGINS-http://localhost:3000,http://127.0.0.1:3000}
      BT_TRUST_FORWARDED_ORIGIN: ${BT_TRUST_FORWARDED_ORIGIN:-false}
      IDENTITY_API_URL: http://identity:8000
      CATALOG_API_URL: http://catalog:8000
      AUCTION_API_URL: http://auction:8000
      PRICING_API_URL: http://pricing:8000
      ORDERS_API_URL: http://orders:8000
      ELIGIBILITY_API_URL: http://eligibility:8000
      TRUST_API_URL: http://trust:8000
      COMMUNICATIONS_API_URL: http://communications:8000
      SERVICE_OPERATIONS_API_URL: http://service-operations:8000
    ports: ["127.0.0.1:3000:3000"]
    init: true
    mem_limit: 512m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  postgres-data:
