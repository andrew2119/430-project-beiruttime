[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bt-bulkheads"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ['httpx==0.28.1']

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bt_runtime" = ["migrations/*.sql"]
