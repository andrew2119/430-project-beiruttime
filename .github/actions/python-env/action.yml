name: Python environment
description: Python 3.11 with one virtual environment holding every service's pinned requirements.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: services/*/runtime/requirements*.txt
    - name: Install service requirements
      shell: bash
      run: |
        set -euo pipefail
        python -m venv "$RUNNER_TEMP/venv"
        args=()
        for file in services/*/runtime/requirements.txt services/*/runtime/requirements-dev.txt; do
          case "$file" in services/_template/*) continue ;; esac
          args+=(-r "$file")
        done
        "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check --no-input --quiet "${args[@]}" \
          packages/contracts-core packages/bulkheads packages/events packages/runtime
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        echo "BT_CI_PYTHON=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"
