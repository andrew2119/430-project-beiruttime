# The light Beirut Time check on every pull request to main. See .github/ci/README.md.
# It runs lint, types and the tests the changed paths reach. It is not the full suite;
# the Tests workflow is.
# On demand it can check one pull request by number: its merge commit with main, planned from
# the paths it changes, or its head commit with every light suite when GitHub has no merge
# commit for it, always with this workflow's own CI files.
name: Light checks
run-name: ${{ inputs.pr && format('Light checks for pull request {0}', inputs.pr) || github.event.pull_request.title || 'Light checks' }}

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to check (empty checks every light suite on the chosen branch)
        type: string
        required: false

permissions:
  contents: read

# One group per pull request, and one per dispatched pull request number, so dispatches for
# different pull requests run side by side; a newer run in the same group cancels the older one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('light-checks-pr-{0}', github.event.pull_request.number) || format('light-checks-dispatch-{0}', inputs.pr || github.ref) }}
  cancel-in-progress: true

jobs:
  plan:
    name: changed-path plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      services: ${{ steps.plan.outputs.services }}
      web: ${{ steps.plan.outputs.web }}
      lanes: ${{ steps.plan.outputs.lanes }}
      plan: ${{ steps.plan.outputs.plan }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check the pull request number
        if: inputs.pr
        env:
          PR: ${{ inputs.pr }}
        run: '[[ "$PR" =~ ^[1-9][0-9]{0,6}$ ]] || { echo "::error::Not a pull request number: $PR"; exit 1; }'
      # Depth 2 keeps the merge commit's first parent, the tip of main, for the diff.
      - name: Check out the pull request merged with main
        id: merge
        if: inputs.pr
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ inputs.pr }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Check out the pull request head (GitHub has no merge commit for it)
        if: inputs.pr && steps.merge.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          persist-credentials: false
      - if: ${{ !inputs.pr }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Fetch this workflow's CI files
        if: inputs.pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .ci-self
          sparse-checkout: .github
          persist-credentials: false
      - name: Use this workflow's CI files
        if: inputs.pr
        run: |
          if [ -e .github ]; then mv .github "$RUNNER_TEMP/tested-github"; fi
          mv .ci-self/.github .github && mv .ci-self "$RUNNER_TEMP/ci-self"
      - name: Record the checked commit
        id: commit
        if: inputs.pr
        env:
          PR: ${{ inputs.pr }}
          SOURCE: ${{ steps.merge.outcome == 'success' && 'merged with main' || 'head, not merged' }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Checking pull request $PR at \`$sha\` ($SOURCE), with the CI files of \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
      # A pull request event, or a dispatch that found the merge commit, checks what the change
      # reaches; any other dispatch checks every light suite.
      - name: Map the changed paths to the suites they reach
        id: plan
        env:
          EVERY: ${{ github.event_name == 'workflow_dispatch' && steps.merge.outcome != 'success' }}
        run: |
          if [ "$EVERY" = true ]; then python3 .github/ci/changed.py --all; else python3 .github/ci/changed.py; fi

  services:
    name: service (${{ matrix.service }})
    needs: plan
    if: needs.plan.outputs.services != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:747d5ed1fdeeb124b880fbe3d7c6557d2c4064ae41d6b6297d417882effce4be
        env:
          POSTGRES_PASSWORD: local-bootstrap-only
        ports: ["54329:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Fetch this workflow's CI files
        if: inputs.pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .ci-self
          sparse-checkout: .github
          persist-credentials: false
      - name: Use this workflow's CI files
        if: inputs.pr
        run: |
          if [ -e .github ]; then mv .github "$RUNNER_TEMP/tested-github"; fi
          mv .ci-self/.github .github && mv .ci-self "$RUNNER_TEMP/ci-self"
      - uses: ./.github/actions/python-env
      - name: Create the service databases
        run: bash .github/ci/db-init.sh
      - name: Run the service tests
        run: mkdir -p "$RUNNER_TEMP/reports" && python .github/ci/services.py "${{ matrix.service }}" "$RUNNER_TEMP/reports/${{ matrix.service }}.json"
      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ matrix.service }}
          path: ${{ runner.temp }}/reports/${{ matrix.service }}.json
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore

  lanes:
    name: integration lanes
    needs: plan
    if: needs.plan.outputs.lanes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Fetch this workflow's CI files
        if: inputs.pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .ci-self
          sparse-checkout: .github
          persist-credentials: false
      - name: Use this workflow's CI files
        if: inputs.pr
        run: |
          if [ -e .github ]; then mv .github "$RUNNER_TEMP/tested-github"; fi
          mv .ci-self/.github .github && mv .ci-self "$RUNNER_TEMP/ci-self"
      - uses: ./.github/actions/python-env
      - name: Run the integration lane tests
        run: mkdir -p "$RUNNER_TEMP/reports" && python .github/ci/lanes.py "$RUNNER_TEMP/reports/lanes.json"
      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-lanes
          path: ${{ runner.temp }}/reports/lanes.json
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore

  web:
    name: web lint and types
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Fetch this workflow's CI files
        if: inputs.pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .ci-self
          sparse-checkout: .github
          persist-credentials: false
      - name: Use this workflow's CI files
        if: inputs.pr
        run: |
          if [ -e .github ]; then mv .github "$RUNNER_TEMP/tested-github"; fi
          mv .ci-self/.github .github && mv .ci-self "$RUNNER_TEMP/ci-self"
      - uses: ./.github/actions/node-env
      - name: Lint, type check and the money format test
        run: mkdir -p "$RUNNER_TEMP/reports" && bash .github/ci/web-checks.sh "$RUNNER_TEMP/reports/web.json"
      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-web
          path: ${{ runner.temp }}/reports/web.json
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore

  vitest:
    name: web tests (${{ matrix.shard }}/4)
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Fetch this workflow's CI files
        if: inputs.pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .ci-self
          sparse-checkout: .github
          persist-credentials: false
      - name: Use this workflow's CI files
        if: inputs.pr
        run: |
          if [ -e .github ]; then mv .github "$RUNNER_TEMP/tested-github"; fi
          mv .ci-self/.github .github && mv .ci-self "$RUNNER_TEMP/ci-self"
      - uses: ./.github/actions/node-env
      # The navigation index is generated and kept out of git; the web scripts make it before use.
      - name: Generate the navigation index
        working-directory: web
        run: node scripts/generate-nav.mjs
      - name: Run this shard's share of the web test suites
        run: mkdir -p "$RUNNER_TEMP/reports" && python3 .github/ci/vitest.py "${{ matrix.shard }}" 4 "$RUNNER_TEMP/reports/shard${{ matrix.shard }}.json"
      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-shard${{ matrix.shard }}
          path: ${{ runner.temp }}/reports/shard${{ matrix.shard }}.json
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore

  verify:
    name: every reached test ran
    needs: [plan, services, lanes, web, vitest]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Fetch this workflow's CI files
        if: inputs.pr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .ci-self
          sparse-checkout: .github
          persist-credentials: false
      - name: Use this workflow's CI files
        if: inputs.pr
        run: |
          if [ -e .github ]; then mv .github "$RUNNER_TEMP/tested-github"; fi
          mv .ci-self/.github .github && mv .ci-self "$RUNNER_TEMP/ci-self"
      # verify.py judges missing reports, so a download with nothing to fetch must not stop it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: report-*
          merge-multiple: true
          path: ${{ runner.temp }}/reports
      - name: Check every reached job's report against the pinned lists
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
          python3 .github/ci/verify.py light "$RUNNER_TEMP/needs.json" "$RUNNER_TEMP/reports"

  # Proof-only job for a throwaway proof pull request; never merged.
  a07-tests-proof:
    name: A07 named tests (proof only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
      - name: Run the L14 event destination tests
        run: python -m pytest -p no:cacheprovider -o asyncio_mode=auto -v tests/lanes/L14/WIRE-L14/test_event_destinations.py
      - name: List the event ingress tests the auction services job must collect and pass
        run: |
          python3 -I - <<'EOF'
          import sys
          sys.path.insert(0, '.github/ci')
          import services
          found = sorted(t for t in services.definitions('auction')
                         if t[0] == 'services/auction/runtime/tests/test_event_ingress.py')
          for test in found:
              print('::'.join(filter(None, test)))
          sys.exit(0 if len(found) == 2 else 1)
          EOF
      - uses: ./.github/actions/node-env
      - name: Generate the navigation index
        working-directory: web
        run: node scripts/generate-nav.mjs
      - name: Run the locale refresh and proxy bid presentation tests
        working-directory: web
        run: |
          pnpm exec vitest run --config vitest.config.ts --root . tests/locale-route-refresh.test.tsx --reporter=verbose
          pnpm exec vitest run --config features/proxy-bid/vitest.config.ts --root . features/proxy-bid/presentation.test.tsx --reporter=verbose
