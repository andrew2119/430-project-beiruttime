# The light Beirut Time check on every pull request to main. See .github/ci/README.md.
# It runs lint, types and the tests the changed paths reach. It is not the full suite;
# the Tests workflow is.
name: Light checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: light-checks-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: changed-path plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      services: ${{ steps.plan.outputs.services }}
      web: ${{ steps.plan.outputs.web }}
      lanes: ${{ steps.plan.outputs.lanes }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      # Depth 2 keeps the merge commit's first parent, the tip of main, for the diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Map the changed paths to the suites they reach
        id: plan
        run: python3 .github/ci/changed.py

  services:
    name: service (${{ matrix.service }})
    needs: plan
    if: needs.plan.outputs.services != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:747d5ed1fdeeb124b880fbe3d7c6557d2c4064ae41d6b6297d417882effce4be
        env:
          POSTGRES_PASSWORD: local-bootstrap-only
        ports: ["54329:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
      - name: Create the service databases
        run: bash .github/ci/db-init.sh
      - name: Run the service tests
        run: mkdir -p "$RUNNER_TEMP/reports" && python .github/ci/services.py "${{ matrix.service }}" "$RUNNER_TEMP/reports/${{ matrix.service }}.json"
      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ matrix.service }}
          path: ${{ runner.temp }}/reports/${{ matrix.service }}.json
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore

  lanes:
    name: integration lanes
    needs: plan
    if: needs.plan.outputs.lanes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-env
      - name: Run the integration lane tests
        run: mkdir -p "$RUNNER_TEMP/reports" && python .github/ci/lanes.py "$RUNNER_TEMP/reports/lanes.json"
      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-lanes
          path: ${{ runner.temp }}/reports/lanes.json
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore

  web:
    name: web lint and types
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-env
      - name: Lint, type check and the money format test
        run: mkdir -p "$RUNNER_TEMP/reports" && bash .github/ci/web-checks.sh "$RUNNER_TEMP/reports/web.json"
      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-web
          path: ${{ runner.temp }}/reports/web.json
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore

  vitest:
    name: web tests (${{ matrix.shard }}/3)
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-env
      - name: Run this shard of every web test suite
        run: mkdir -p "$RUNNER_TEMP/reports" && python3 .github/ci/vitest.py "${{ matrix.shard }}" 3 "$RUNNER_TEMP/reports/shard${{ matrix.shard }}.json"
      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-shard${{ matrix.shard }}
          path: ${{ runner.temp }}/reports/shard${{ matrix.shard }}.json
          retention-days: 3
          overwrite: true
          if-no-files-found: ignore

  verify:
    name: every reached test ran
    needs: [plan, services, lanes, web, vitest]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # verify.py judges missing reports, so a download with nothing to fetch must not stop it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: report-*
          merge-multiple: true
          path: ${{ runner.temp }}/reports
      - name: Check every reached job's report against the pinned lists
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
          python3 .github/ci/verify.py light "$RUNNER_TEMP/needs.json" "$RUNNER_TEMP/reports"
